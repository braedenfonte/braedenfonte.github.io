<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taterbottom Saloon</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#160e0a;color:#ffebc7;font:1.05rem Georgia,serif}
button{font:inherit;color:inherit;background:#351b0f;border:1px solid #c59150;border-radius:.3rem;padding:.75rem 1rem;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #ffd18e;outline-offset:4px}
.stage{--frame:max(100vw, 177.68dvh);--zoom:1.36;--edge:calc((var(--frame) - 100vw / var(--zoom)) / 2);
  position:relative;width:100%;height:100dvh;isolation:isolate;overflow:clip;background:#24150f}
@media(min-aspect-ratio:1/1){.stage{--zoom:1.55}}
.controls{position:fixed;z-index:3;display:flex;gap:.4rem;top:max(.6rem,env(safe-area-inset-top));left:max(.6rem,env(safe-area-inset-left))}
.controls[hidden],.controls [hidden]{display:none}
.controls :is(a,button){display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid #b18a60;
  border-radius:.35rem;background:#1d100bd9;color:#ffebc7;text-decoration:none;font:1.2rem system-ui,sans-serif}
.look-controls{left:auto;right:max(.6rem,env(safe-area-inset-right))}
.controls button[aria-disabled="true"]{opacity:.5;cursor:default}
.room{position:absolute;inset:0;background:#180e09;transform-origin:50% 43%;filter:brightness(.77)}
.open .room{transform:scale(var(--zoom));filter:none}
.scene{position:absolute;left:50%;top:50%;width:var(--frame);
  translate:-50% -50%;
  transition:translate .48s cubic-bezier(.22,.68,.28,1)}
.stage[data-look="left"] .scene{translate:calc(-50% + var(--edge)) -50%}
.stage[data-look="right"] .scene{translate:calc(-50% - min(var(--edge), var(--frame) * .245)) -50%}
.scene img{display:block;width:100%;height:auto}
.hotspot{position:absolute;background:transparent;border:0;padding:0;min-width:44px;min-height:44px;-webkit-tap-highlight-color:transparent}
.hotspot:is(:hover,:focus-visible){outline:2px solid #ffd18e;outline-offset:-2px}
[data-cowboy="slim"]{left:43.7%;top:34.5%;width:7.5%;height:11.2%}
[data-cowboy="dusty"]{left:53.1%;top:35%;width:8.9%;height:10.8%}
.sock{left:69%;top:57.2%;width:4.6%;height:6.2%}
.sock-response{position:absolute;left:69%;top:57%;transform:translateY(-100%);margin:0;pointer-events:none}
.sock-response:not(:empty){background:#24130c;color:#ffebc7;border:1px solid #c59150;border-radius:.3rem;padding:.4rem .65rem}
.storefront{position:absolute;left:50%;top:0;width:var(--frame);height:100%;translate:-50% 0;perspective:850px;pointer-events:none;transform-origin:50% 48%;transition:transform .79s cubic-bezier(.53,.08,.36,1) .2s,opacity .38s .48s}
.open .storefront{transform:translate(-1.5%,2%) scale(3.5);opacity:0}
.open .enter{pointer-events:none;opacity:0}
.door{position:absolute;transition:transform .65s cubic-bezier(.2,.75,.32,1.12)}
.left{transform-origin:left}.right{transform-origin:right}
.open .left{transform:rotateY(96deg)}
.open .right{transform:rotateY(-96deg);transition-delay:.055s}
.enter{position:absolute;z-index:1;top:43%;bottom:25%;left:50%;width:min(100%, var(--frame) * .367);translate:-50% 0;background:transparent;border:0;padding:0;min-height:44px;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.enter:is(:hover,:focus-visible){box-shadow:0 0 16px #ffc07566}
.stage:has(.enter:active) .left{transform:rotateY(7deg)}
.stage:has(.enter:active) .right{transform:rotateY(-7deg)}
dialog{width:min(30rem,calc(100% - 2rem));border:1px solid #c59150;border-radius:.5rem;background:#24130c;color:inherit;padding:1.5rem}
dialog::backdrop{background:#100805bd}
@media(prefers-reduced-motion:reduce){.door,.room,.storefront,.scene{transition:none}.stage:has(.enter:active) .door{transform:none}}

/* Match the cutout to the painted door jambs and threshold. */
.facade{position:absolute;inset:0;width:100%;height:100%;
  clip-path:polygon(evenodd,0 0,100% 0,100% 100%,0 100%,0 0,31.65% 13.4%,31.65% 83.2%,68.35% 83.2%,68.35% 13.4%,31.65% 13.4%,0 0)}
/* Both leaves use the same photographed-style timber and ironwork. */
.door{top:43%;bottom:25%;width:18.35%;filter:drop-shadow(0 3px 4px #140804)}
.left{left:31.65%}.right{right:31.65%}
.door img{display:block;width:100%;height:100%}
.right img{transform:scaleX(-1)}
.lamp-glow,.sock-shadow{position:absolute;pointer-events:none;opacity:0}
.lamp-glow{width:15%;height:25%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,#ffc36d55,transparent 66%);mix-blend-mode:screen}
.lamp-glow.hanging{left:60%;top:15%}
.lamp-glow.counter{left:41.3%;top:41%}
.sock-shadow{inset:0;background:url("../saloon/saloon-wide-to-bar.png") center / 100% 100%;
  mask-image:radial-gradient(ellipse .63% 1.1% at 71% 60.1%,#000 38%,transparent 100%)}
.sock-shadow.second{mask-image:radial-gradient(ellipse .58% 1.05% at 71.85% 60.4%,#000 38%,transparent 100%)}
@media(prefers-reduced-motion:no-preference){
  .open .room{animation:walk-to-bar 2.35s both}

  .open .lamp-glow{animation:lamp-flicker 4.8s .95s infinite alternate}
  .open .lamp-glow.counter{animation-delay:1.65s;animation-duration:6.2s}
  .open .sock-shadow{animation:sock-stir 6s 2s infinite}
  .open .sock-shadow.second{animation-delay:2.42s}
}
/* Hold the wide view as the doors clear, then approach the same bar. */
@keyframes walk-to-bar{
  0%{transform:scale(1);filter:brightness(.77)}
  30%{transform:scale(1);filter:brightness(1);animation-timing-function:cubic-bezier(.36,.13,.22,1)}
  100%{transform:scale(var(--zoom));filter:brightness(1)}
}
@keyframes lamp-flicker{0%,20%,44%,78%,100%{opacity:.15} 23%,52%,82%{opacity:.65} 25%,80%{opacity:.3}}
@keyframes sock-stir{0%,14%,34%,100%{opacity:0;transform:translateY(0)} 20%,28%{opacity:1;transform:translateY(-.43%);filter:brightness(1.36)} 24%{opacity:.85;transform:translateY(-.2%)}}
</style>
</head>
<body>
<main>
<div class="controls">
  <a href="/" aria-label="Back to website" title="Back to website">⌂</a>
  <button class="return" type="button" aria-label="Return to entrance" title="Return to entrance" hidden>↶</button>
</div>
<nav class="controls look-controls" aria-label="Look around the saloon" hidden>
  <button type="button" data-pan="-1" aria-label="Look left" title="Look left">‹</button>
  <button type="button" data-pan="1" aria-label="Look right" title="Look right">›</button>
</nav>
<section class="stage" aria-label="Saloon entrance">
  <div class="room" inert>
    <div class="scene">
      <img src="../saloon/saloon-wide-to-bar.png" width="1671" height="941" alt="Slim and Dusty face the entrance from the far bar, with card players to the left and a closed backdoor to the right.">
      <span class="lamp-glow hanging" aria-hidden="true"></span>
      <span class="lamp-glow counter" aria-hidden="true"></span>
      <span class="sock-shadow" aria-hidden="true"></span>
      <span class="sock-shadow second" aria-hidden="true"></span>
      <button class="hotspot" type="button" data-cowboy="slim" aria-label="Slim Pickens Taterbottom" aria-haspopup="dialog"></button>
      <button class="hotspot" type="button" data-cowboy="dusty" aria-label="Dusty Two Teeth Carson" aria-haspopup="dialog"></button>
      <button class="hotspot sock" type="button" aria-label="Inspect the sock"></button>
      <p class="sock-response" role="status"></p>
    </div>
  </div>
  <div class="storefront" aria-hidden="true">
    <div class="door left"><img src="../saloon/saloon-door-leaf.png" alt=""></div>
    <div class="door right"><img src="../saloon/saloon-door-leaf.png" alt=""></div>
    <img class="facade" src="../saloon/saloon-exterior.png" width="1672" height="941" alt="">
  </div>
  <button class="enter" type="button" aria-label="Push open the saloon doors"></button>
</section>
<dialog aria-labelledby="conversation-title">
  <h2 id="conversation-title">At the bar</h2>
  <p id="cowboy-line"></p>
  <p id="reply-line"></p>
  <form method="dialog"><button>Back to the bar</button></form>
</dialog>
</main>
<script>
const stage = document.querySelector(".stage");
const room = document.querySelector(".room");
const enter = document.querySelector(".enter");
const dialog = document.querySelector("dialog");
const back = document.querySelector(".return");
const look = document.querySelector(".look-controls");
const [turnLeft, turnRight] = look.querySelectorAll("button");
const views = ["left", "center", "right"];
let view = 1;

function setView(next) {
  view = Math.max(0, Math.min(views.length - 1, next));
  stage.dataset.look = views[view];
  // Keep the buttons focusable when reaching the end of the panorama.
  turnLeft.setAttribute("aria-disabled", view === 0);
  turnRight.setAttribute("aria-disabled", view === views.length - 1);
}

look.addEventListener("click", event => {
  const turn = event.target.closest("[data-pan]");
  if (turn) setView(view + Number(turn.dataset.pan));
});

back.addEventListener("click", () => {
  room.inert = true;
  look.hidden = true;
  back.hidden = true;
  stage.classList.remove("open");
  stage.setAttribute("aria-label", "Saloon entrance");
  room.querySelector(".sock-response").textContent = "";
  setView(1);
  enter.hidden = false;
  enter.focus({ preventScroll: true });
});
const conversations = {
  slim: ["Slim: You're about as subtle as a mule in a church choir.", "Dusty: Mule could carry a tune. You just carried on."],
  dusty: ["Dusty: That plan's got more holes than my Sunday socks.", "Slim: That's a hell of a thing to say with two teeth and a harmonica."]
};
enter.addEventListener("click", async () => {
  if (stage.classList.contains("open")) return;
  stage.classList.add("open");
  stage.setAttribute("aria-label", "Inside the saloon");
  const walk = room.getAnimations().find(animation => animation.animationName === "walk-to-bar");
  if (walk) await walk.finished.catch(() => {});
  room.inert = false;
  back.hidden = false;
  look.hidden = false;
  setView(1);
  room.querySelector("button").focus({ preventScroll: true });
  enter.hidden = true;
});
room.addEventListener("focusin", event => {
  if (!event.target.matches(".hotspot:focus-visible")) return;
  const bounds = event.target.getBoundingClientRect();
  if (bounds.right <= 0) setView(0);
  else if (bounds.left >= stage.clientWidth) setView(2);
});

room.querySelector(".sock").addEventListener("click", () => {
  room.querySelector(".sock-response").textContent = "Hmmmm...";
});
room.querySelectorAll("[data-cowboy]").forEach(button => {
  button.addEventListener("click", () => {
    const [opening, reply] = conversations[button.dataset.cowboy];
    document.querySelector("#cowboy-line").textContent = opening;
    document.querySelector("#reply-line").textContent = reply;
    dialog.showModal();
  });
});
</script>
</body>
</html>
