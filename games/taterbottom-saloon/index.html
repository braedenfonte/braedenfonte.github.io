<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taterbottom Saloon</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#160e0a;color:#ffebc7;font:1.05rem Georgia,serif}
button{font:inherit;color:inherit;background:#351b0f;border:1px solid #c59150;border-radius:.3rem;padding:.75rem 1rem;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #ffd18e;outline-offset:4px}
.stage{--frame:max(100vw, 177.68dvh);--zoom:1.36;--edge:calc((var(--frame) - 100vw / var(--zoom)) / 2);
  position:relative;width:100%;height:100dvh;isolation:isolate;overflow:clip;background:#24150f}
@media(min-aspect-ratio:1/1){.stage{--zoom:1.55}}
.controls{position:fixed;z-index:3;display:flex;gap:.4rem;top:max(.6rem,env(safe-area-inset-top));left:max(.6rem,env(safe-area-inset-left))}
.controls[hidden],.controls [hidden]{display:none}
.controls :is(a,button){display:grid;place-items:center;width:44px;height:44px;padding:0;border:1px solid #b18a60;
  border-radius:.35rem;background:#1d100bd9;color:#ffebc7;text-decoration:none;font:1.2rem system-ui,sans-serif}
.look-controls{left:auto;right:max(.6rem,env(safe-area-inset-right))}
.controls button[aria-disabled="true"]{opacity:.5;cursor:default}
.room{position:absolute;inset:0;background:#180e09;transform-origin:50% 43%;filter:brightness(.77)}
.open .room{transform:scale(var(--zoom));filter:none}
.scene{position:absolute;left:50%;top:50%;width:var(--frame);
  translate:-50% -50%;
  transition:translate .48s cubic-bezier(.22,.68,.28,1)}
.stage[data-look="left"] .scene{translate:calc(-50% + var(--edge)) -50%}
.stage[data-look="right"] .scene{translate:calc(-50% - min(var(--edge), var(--frame) * .245)) -50%}
.scene img{display:block;width:100%;height:auto}
.hotspot{position:absolute;background:transparent;border:0;padding:0;min-width:44px;min-height:44px;-webkit-tap-highlight-color:transparent}
.hotspot:is(:hover,:focus-visible){outline:2px solid #ffd18e;outline-offset:-2px}
[data-cowboy="slim"]{left:43.7%;top:34.5%;width:7.5%;height:11.2%}
[data-cowboy="dusty"]{left:53.1%;top:35%;width:8.9%;height:10.8%}
.sock{left:69%;top:57.2%;width:4.6%;height:6.2%}
.sock-response{position:absolute;left:69%;top:57%;transform:translateY(-100%);margin:0;pointer-events:none}
.sock-response:not(:empty){background:#24130c;color:#ffebc7;border:1px solid #c59150;border-radius:.3rem;padding:.4rem .65rem}
.storefront{position:absolute;left:50%;top:0;width:var(--frame);height:100%;translate:-50% 0;perspective:850px;pointer-events:none;transform-origin:50% 48%;transition:transform .79s cubic-bezier(.53,.08,.36,1) .2s,opacity .38s .48s}
.open .storefront{transform:translate(-1.5%,2%) scale(3.5);opacity:0}
.open .enter{pointer-events:none;opacity:0}
.door{position:absolute;transition:transform .65s cubic-bezier(.2,.75,.32,1.12)}
.left{transform-origin:left}.right{transform-origin:right}
.open .left{transform:rotateY(96deg)}
.open .right{transform:rotateY(-96deg);transition-delay:.055s}
.enter{position:absolute;z-index:1;top:43%;bottom:25%;left:50%;width:min(100%, var(--frame) * .367);translate:-50% 0;background:transparent;border:0;padding:0;min-height:44px;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.enter:is(:hover,:focus-visible){box-shadow:0 0 16px #ffc07566}
.stage:has(.enter:active) .left{transform:rotateY(7deg)}
.stage:has(.enter:active) .right{transform:rotateY(-7deg)}
dialog{width:min(30rem,calc(100% - 2rem));border:1px solid #c59150;border-radius:.5rem;background:#24130c;color:inherit;padding:1.5rem}
dialog::backdrop{background:#10080580}
.conversation{margin:auto auto max(1rem,env(safe-area-inset-bottom));background:#20110cf5;
  max-height:calc(100dvh - 2rem);overflow:auto;box-shadow:0 12px 48px #090402cc}
.conversation h2{margin:0 0 .6rem;font-size:1.35rem;color:#f5cf94}
.exchange{font-size:1rem;line-height:1.5}
.exchange p{margin:.45rem 0}.exchange{min-height:5.3rem}
.speaker{color:#f5cf94}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem;margin:1rem 0}
.topics button{background:#603820;text-align:left}
.topics button{min-height:44px;padding:.5rem .65rem}.topics button[data-roast]{border-color:#ffd18e;background:#71361c}
.topics button:enabled:hover,.conversation form button:hover{background:#80512e}
.conversation form button{font:inherit;font-size:.9rem}
@media(prefers-reduced-motion:reduce){.door,.room,.storefront,.scene{transition:none}.stage:has(.enter:active) .door{transform:none}}

/* Match the cutout to the painted door jambs and threshold. */
.facade{position:absolute;inset:0;width:100%;height:100%;
  clip-path:polygon(evenodd,0 0,100% 0,100% 100%,0 100%,0 0,31.65% 13.4%,31.65% 83.2%,68.35% 83.2%,68.35% 13.4%,31.65% 13.4%,0 0)}
/* Both leaves use the same photographed-style timber and ironwork. */
.door{top:43%;bottom:25%;width:18.35%;filter:drop-shadow(0 3px 4px #140804)}
.left{left:31.65%}.right{right:31.65%}
.door img{display:block;width:100%;height:100%}
.right img{transform:scaleX(-1)}
.dust{inset:0;background:
  radial-gradient(circle at 42% 28%,#ffcc8d 0 1px,transparent 2px),
  radial-gradient(circle at 48% 32%,#ffdbaf 0 1px,transparent 2px),
  radial-gradient(circle at 60% 26%,#ffcc8d 0 1px,transparent 2px),
  radial-gradient(circle at 65% 35%,#ffe1b4 0 1px,transparent 2px),
  radial-gradient(circle at 54% 48%,#ffd5a4 0 1px,transparent 2px)}
.dust.second{scale:-1 1}
.lamp,.sock-shadow{position:absolute;pointer-events:none;opacity:0}
.lamp{left:var(--x);top:var(--y);width:6%;height:10%;translate:-50% -50%;
  background:radial-gradient(ellipse,#ffaf483f,transparent 69%);mix-blend-mode:screen}
.lamp::after{content:"";position:absolute;inset:37% 43% 40%;
  background:radial-gradient(ellipse at 50% 61%,#fff8ca 0 14%,#ffc45c8c 34%,transparent 68%);
  transform-origin:50% 74%}
.sock-shadow{inset:0;background:url("../saloon/saloon-wide-to-bar.png") center / 100% 100%;
  mask-image:radial-gradient(ellipse .63% 1.1% at 71% 60.1%,#000 38%,transparent 100%)}
.sock-shadow.second{mask-image:radial-gradient(ellipse .58% 1.05% at 71.85% 60.4%,#000 38%,transparent 100%)}
@media(prefers-reduced-motion:no-preference){
  .open .room{animation:walk-to-bar 2.35s both}

  .settled .lamp{animation:lamp-flicker var(--cycle) var(--phase) steps(1,end) infinite}
  .settled .lamp::after{animation:flame-shape var(--cycle) var(--phase) linear infinite}
  .settled .dust{animation:dust-drift 8s linear infinite}
  .settled .dust.second{animation-delay:-4s}
  .open .sock-shadow{animation:sock-stir 6s 2s infinite}
  .open .sock-shadow.second{animation-delay:2.42s}
}
/* Hold the wide view as the doors clear, then approach the same bar. */
@keyframes walk-to-bar{
  0%{transform:scale(1);filter:brightness(.77)}
  30%{transform:scale(1);filter:brightness(1);animation-timing-function:cubic-bezier(.36,.13,.22,1)}
  100%{transform:scale(var(--zoom));filter:brightness(1)}
}
@keyframes dust-drift{0%{opacity:0;transform:translate(-2%,2%)} 30%,65%{opacity:.55}
  100%{opacity:0;transform:translate(2%,-4%)}}
@keyframes lamp-flicker{
  0%,100%{opacity:.55} 8%{opacity:.31} 17%{opacity:.8} 24%{opacity:.58}
  39%{opacity:.42} 44%{opacity:.65} 62%{opacity:.38} 72%{opacity:.76} 89%{opacity:.46}
}
@keyframes flame-shape{
  0%,100%{transform:scale(.8,.92) rotate(-4deg)}
  17%,62%{transform:scale(.96,.76) rotate(6deg)}
  34%,77%{transform:scale(.74,1.16) rotate(-7deg)}
}
@keyframes sock-stir{0%,14%,34%,100%{opacity:0;transform:translateY(0)} 20%,28%{opacity:1;transform:translateY(-.43%);filter:brightness(1.36)} 24%{opacity:.85;transform:translateY(-.2%)}}
</style>
</head>
<body>
<main>
<div class="controls">
  <a href="/" aria-label="Back to website" title="Back to website">⌂</a>
  <button class="return" type="button" aria-label="Return to entrance" title="Return to entrance" hidden>↶</button>
</div>
<nav class="controls look-controls" aria-label="Look around the saloon" hidden>
  <button type="button" data-pan="-1" aria-label="Look left" title="Look left">‹</button>
  <button type="button" data-pan="1" aria-label="Look right" title="Look right">›</button>
</nav>
<section class="stage" aria-label="Saloon entrance">
  <div class="room" inert>
    <div class="scene">
      <img src="../saloon/saloon-wide-to-bar.png" width="1671" height="941" alt="Slim and Dusty face the entrance from the far bar, with card players to the left and a closed backdoor to the right.">
      <span class="dust" aria-hidden="true"></span>
      <span class="dust second" aria-hidden="true"></span>
      <span class="lamp" style="--x:27.3%;--y:21.7%;--cycle:1.8s;--phase:-.4s" aria-hidden="true"></span>
      <span class="lamp" style="--x:42.4%;--y:27.5%;--cycle:2.1s;--phase:-1.3s" aria-hidden="true"></span>
      <span class="lamp" style="--x:60.2%;--y:15.3%;--cycle:1.6s;--phase:-.7s" aria-hidden="true"></span>
      <span class="lamp" style="--x:73.9%;--y:26.8%;--cycle:2.4s;--phase:-1s" aria-hidden="true"></span>
      <span class="lamp" style="--x:41.3%;--y:40.9%;--cycle:1.9s;--phase:-.9s" aria-hidden="true"></span>
      <span class="sock-shadow" aria-hidden="true"></span>
      <span class="sock-shadow second" aria-hidden="true"></span>
      <button class="hotspot" type="button" data-cowboy="slim" aria-label="Slim Pickens Taterbottom" aria-haspopup="dialog"></button>
      <button class="hotspot" type="button" data-cowboy="dusty" aria-label="Dusty Two Teeth Carson" aria-haspopup="dialog"></button>
      <button class="hotspot sock" type="button" aria-label="Inspect the sock"></button>
      <p class="sock-response" role="status"></p>
    </div>
  </div>
  <div class="storefront" aria-hidden="true">
    <div class="door left"><img src="../saloon/saloon-door-leaf.png" alt=""></div>
    <div class="door right"><img src="../saloon/saloon-door-leaf.png" alt=""></div>
    <img class="facade" src="../saloon/saloon-exterior.png" width="1672" height="941" alt="">
  </div>
  <button class="enter" type="button" aria-label="Push open the saloon doors"></button>
</section>
<dialog class="conversation" aria-labelledby="conversation-title">
  <h2 id="conversation-title">At the bar</h2>
  <div class="exchange" aria-live="polite" aria-atomic="true">
    <strong class="speaker"></strong>
    <p></p>
  </div>
  <div class="topics" role="group" aria-label="Choose what to say"></div>
  <form method="dialog"><button>Back to the bar</button></form>
</dialog>
</main>
<script>
const stage = document.querySelector(".stage");
const room = document.querySelector(".room");
const enter = document.querySelector(".enter");
const dialog = document.querySelector("dialog");
const back = document.querySelector(".return");
const look = document.querySelector(".look-controls");
const [turnLeft, turnRight] = look.querySelectorAll("button");
const views = ["left", "center", "right"];
let view = 1;

function setView(next) {
  view = Math.max(0, Math.min(views.length - 1, next));
  stage.dataset.look = views[view];
  // Keep the buttons focusable when reaching the end of the panorama.
  turnLeft.setAttribute("aria-disabled", view === 0);
  turnRight.setAttribute("aria-disabled", view === views.length - 1);
}

look.addEventListener("click", event => {
  const turn = event.target.closest("[data-pan]");
  if (turn) setView(view + Number(turn.dataset.pan));
});

back.addEventListener("click", () => {
  room.inert = true;
  look.hidden = true;
  back.hidden = true;
  stage.classList.remove("open", "settled");
  stage.setAttribute("aria-label", "Saloon entrance");
  room.querySelector(".sock-response").textContent = "";
  setView(1);
  enter.hidden = false;
  enter.focus({ preventScroll: true });
});
const cowboyNames = { slim: "Slim", dusty: "Dusty" };
const greetings = {
  slim: "Pull up a stool. Dusty's been trying to sell me a story all evening.",
  dusty: "Evening, stranger. If Slim says I owe him money, ask him to show you the receipt."
};
const stories = [
  {
    label: "Who’s cheating at cards?",
    slim: "Man on the left has five aces. I know because I sold him four.",
    dustyLead: "That dealer's got five aces. One of 'em is mine, but I ain't saying which.",
    dusty: "Fifth one's mine. That's the trouble with lending to friends."
  },
  {
    label: "What’s new in town?",
    slim: "Mayor promised to drain the swamp. Turns out he meant his bathtub.",
    dustyLead: "Mayor put a committee in charge of his bathtub. That's the biggest thing he's drained all year.",
    dusty: "And he hired a committee to watch the plug."
  },
  {
    label: "What’s in the whiskey?",
    slim: "Grain, water, and whatever peeled off the inside of the barrel.",
    dustyLead: "Whiskey's got enough wood in it to count as a vegetable.",
    dusty: "Don't ruin the recipe. That's the only fiber I get."
  },
  {
    label: "How’d Dusty lose his teeth?",
    slim: "He tried to open a bottle with his teeth. Then he tried to open the dentist's door with his head.",
    dustyLead: "I lost the teeth opening a bottle. I lost the hat trying to pay the dentist.",
    dusty: "The bottle opened. Put that in the damn story."
  },
  {
    label: "Tell me about the sheriff",
    slim: "He arrested his own horse for leaving the scene of a crime.",
    dustyLead: "Sheriff locked up his own horse. The horse has a better lawyer.",
    dusty: "Horse made bail. Sheriff couldn't raise it last time."
  },
  {
    label: "What’s that smell?",
    slim: "If it follows you out, charge it for the room.",
    dustyLead: "Got a smell in here so mean the flies wouldn't testify.",
    dusty: "If it follows me out, I'm charging it for the damn whiskey."
  }
];
enter.addEventListener("click", async () => {
  if (stage.classList.contains("open")) return;
  stage.classList.add("open");
  stage.setAttribute("aria-label", "Inside the saloon");
  const walk = room.getAnimations().find(animation => animation.animationName === "walk-to-bar");
  if (walk) await walk.finished.catch(() => {});
  stage.classList.add("settled");
  room.inert = false;
  back.hidden = false;
  look.hidden = false;
  setView(1);
  room.querySelector("button").focus({ preventScroll: true });
  enter.hidden = true;
});
room.addEventListener("focusin", event => {
  if (!event.target.matches(".hotspot:focus-visible")) return;
  const bounds = event.target.getBoundingClientRect();
  if (bounds.right <= 0) setView(0);
  else if (bounds.left >= stage.clientWidth) setView(2);
});

room.querySelector(".sock").addEventListener("click", () => {
  room.querySelector(".sock-response").textContent = "Hmmmm...";
});
const exchange = dialog.querySelector(".exchange");
const topics = dialog.querySelector(".topics");
const roasts = [
  // Familiar sayings and stock insults.
  "You're all hat and no cattle.",
  "You're a few steers short of a stampede.",
  "You couldn't pour piss out of a boot with the instructions on the heel.",
  "You couldn't find your own ass with both hands and a map.",
  "If brains were dynamite, you wouldn't have enough to blow your nose.",
  "You're about as useful as a saddle on a sow.",
  "You couldn't hit the broad side of a barn from the inside.",
  "You're about as welcome as a skunk at a lawn party.",
  "You've got more brass than brains.",
  "You could start an argument in an empty house.",
  "You're slicker than a greased pig and twice as hard to get a straight answer out of.",
  "You're so full of shit your eyes are brown.",
  "You could fuck up a two-car funeral.",
  "You'd lose a battle of wits with a fence post.",
  "You're as full of wind as a corn-fed horse.",
  "You're about as much use as a chocolate teapot.",

  // Saloon originals.
  "I'd ask you to hold my beer, but I ain't got time to explain which end goes up.",
  "I saw a mule kick you in the head. Damned if the mule didn't walk away smarter.",
  "The last time you had a good idea, the bartender called it out for lost and found.",
  "If your poker face got any worse, it'd start showing me your damn cards.",
  "I'd call you two-faced, but I reckon you'd have worn the other one tonight.",
  "I bought you a drink once. Even the whiskey tried to get out of it.",
  "You ride so poorly the horse keeps a little flask under the saddle.",
  "You got the stride of a man who's just lost a fight with his own spurs.",
  "I heard your horse threw you. First sensible thing that animal's done all week.",
  "You spend so long telling a story, the lie grows old enough to order a drink.",
  "You make a hell of a first impression. It's the second sentence that ruins it.",
  "The preacher prayed for rain, the crops, and a good excuse to leave before you got to the point.",
  "Your plan has three steps. Bad idea, worse idea, and asking me for bail.",
  "I'd let you count the winnings, but the deck's short enough already.",
  "If the sheriff wanted to watch you think, he'd have to bring a bedroll.",
  "You've been on your high horse all night. Somebody get the poor bastard a chair.",
  "That's a mighty fine belt buckle. Must be doing all the work, holding up that much bullshit.",
  "I wouldn't say you're slow. I'd just tell you the joke on Thursday if I wanted you laughing by Sunday.",
  "I reckon the only thing you've ever drawn fast is a conclusion.",
  "You'd sell the town well for drinking money and come back asking where the water went.",
  "A rattler bit you once. It spent the rest of the day trying to suck the poison back out.",
  "You got a face that makes a wanted poster look like a missing-person request.",
  "You smell like the inside of a boot that died of natural causes.",
  "I can see why the barber charges you up front. He doesn't want to be associated with the result.",
  "When you say 'trust me,' even the piano stops playing.",
  "You'd get caught bluffing at solitaire and still ask for a rematch.",
  "I like hearing your plans. It reminds me to keep my own horse saddled.",
  "The town drunk heard you explain yourself and ordered a coffee.",
  "You bring a lot to the table. Mostly elbows and bad news.",
  "If borrowing money were honest work, you'd be the hardest-working bastard in the territory.",
  "Your alibi would hold water if we put it in a bucket and stopped listening to it.",
  "You tipped your hat to the mirror and waited for the other fella to go first.",
  "You'd haggle over free pie and still get charged for the plate.",
  "Hell, I've seen better timing from a rooster with a hangover.",
  "You got a future in politics. I haven't met another man who can forget a promise before he's done making it.",
  "I'd follow you into hell, but only because you'd miss the turn.",
  "They ought to put your picture on the whiskey bottle, right under 'may impair judgment.'",
  "If you ever get a statue, the pigeons are gonna take it personally.",
  "Your horse don't know the way home. It just knows where you usually fall off.",
  "You're the only man I know who can lose his temper and somehow get dumber looking for it.",
  "I heard you invented a faster way to shovel shit. You just open your mouth.",
  "You walked in like you owned the place and ordered like you owed it money.",
  "I've seen you tip. The bartender thought you were showing him a rash.",
  "You got the confidence of a man who hears the word 'warrant' and assumes he won something.",
  "You talk faster when you're lying. Some nights I can barely see your mouth move.",
  "I'd tell you to quit while you're ahead, but I haven't seen you ahead since you cut in line.",
  "You got thrown out of a ghost town. I'd ask how, but I'm sure you'd take credit for it.",
  "You look like you washed up for church and got baptized in the horse trough by mistake."
];
const remainingRoasts = [];
let lastRoast;
const comebacks = [
  ["Deal me in", "Sure. Put your money in this hat. Saves us both the trouble of dealing."],
  ["Run for mayor", "On what platform? Last fella who stood on one out here dropped six feet."],
  ["Pour me one", "You want it in a glass, or straight into whatever's eating the finish off your boots?"],
  ["Buy Dusty a drink", "Get him the soft whiskey. Last time we served it neat he tried to chew it."],
  ["Bet on the horse", "Already did. Only honest thing in town and the bastard still owes me five dollars."],
  ["Blame the whiskey", "Funny. The whiskey just told me to blame you."]
];

function showTurn(who, text, choices) {
  exchange.querySelector(".speaker").textContent = cowboyNames[who];
  exchange.querySelector("p").textContent = text;
  topics.replaceChildren(...choices.map(([label, action, roast]) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    if (roast) button.dataset.roast = "";
    button.addEventListener("click", action);
    return button;
  }));
  if (dialog.open) topics.firstElementChild.focus();
}

function showTopics(text = greetings[speaker]) {
  showTurn(speaker, text, [
    ...stories.map((story, index) => [story.label, () => tellStory(story, comebacks[index])]),
    ["Roast me", roast, true]
  ]);
}

function tellStory(story, [move, punchline]) {
  const other = speaker === "slim" ? "dusty" : "slim";
  const nextChoices = [
    ["Change the subject", () => showTopics("All right, what else?")],
    ["Roast me", roast, true]
  ];
  showTurn(speaker, speaker === "dusty" ? story.dustyLead : story.slim, [
    [move, () => showTurn(speaker, punchline, nextChoices)],
    [cowboyNames[other] + ", is that true?", () => showTurn(other, story[other], nextChoices)]
  ]);
}
function roast() {
  const refilling = remainingRoasts.length === 0;
  if (refilling) remainingRoasts.push(...roasts);

  // Skip the previous line on the first draw of a new round.
  const lastIndex = refilling ? remainingRoasts.indexOf(lastRoast) : -1;
  const eligible = remainingRoasts.length - Number(lastIndex !== -1);
  let pick = Math.floor(Math.random() * eligible);
  if (lastIndex !== -1 && pick >= lastIndex) pick++;
  [lastRoast] = remainingRoasts.splice(pick, 1);
  showTurn(speaker, lastRoast, [
    ["Give me another", roast, true],
    ["Ask something else", () => showTopics("Still got questions after that?")]
  ]);
}

room.querySelectorAll("[data-cowboy]").forEach(button => {
  button.addEventListener("click", () => {
    speaker = button.dataset.cowboy;
    showTopics();
    dialog.showModal();
    topics.firstElementChild.focus();
  });
});
</script>
</body>
</html>
